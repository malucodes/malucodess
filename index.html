<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    
    <!-- Redirecionamento para bots e navegadores sem JS -->
    <meta http-equiv="refresh" content="0; URL='https://malucodes.vercel.app/'" />
    
    <!-- Ajuda o Google a entender que o site mudou de endereço -->
    <link rel="canonical" href="https://malucodes.vercel.app/">
    
    <!-- Redirecionamento instantâneo via JavaScript -->
    <script type="text/javascript">
      window.location.href = "https://malucodes.vercel.app/";
    </script>
  </head>
  <body>
    <p>Meu portfólio mudou de endereço! Se você não for redirecionado em alguns segundos, <a href="https://malucodes.vercel.app/">clique aqui</a>.</p>
  </body>
</html>
